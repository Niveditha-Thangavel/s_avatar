version: '3.8'

# Local / CPU-only version — no GPU reservations

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voice-avatar-frontend-local
    ports:
      - "3005:3005"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: voice-avatar-server-local
    ports:
      - "8765:8765"
    environment:
      - OMNIVOICE_DEVICE=cpu
      - TOKENIZERS_PARALLELISM=false
    restart: unless-stopped
