<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar Widget Demo — S2S + PantoMatrix</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a0f1e; color: #fff; }
    .app-layout { display: flex; height: 100vh; }

    .chat-sidebar {
      width: 380px;
      background: rgba(15,23,42,0.8);
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .chat-sidebar h2 { font-size: 18px; color: #00e676; }
    .chat-sidebar p  { font-size: 13px; color: #aaa; line-height: 1.5; }
    code { background: rgba(0,230,118,0.1); color: #00e676; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; }

    button {
      padding: 10px 18px; border-radius: 10px; border: none;
      background: #00e676; color: #000; font-weight: 600;
      font-size: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary {
      background: rgba(255,255,255,0.08); color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    select {
      width: 100%; padding: 9px 12px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.3); color: #fff; font-size: 14px;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .log-box {
      flex: 1; min-height: 80px; max-height: 200px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 10px;
      font-size: 12px; font-family: monospace;
      overflow-y: auto; color: #ccc;
    }
    .log-box .line { margin-bottom: 4px; }
    .log-box .transcript { color: #00e676; }
    .log-box .tts        { color: #82b1ff; }
    .log-box .err        { color: #ff5252; }

    .avatar-panel {
      flex: 1; position: relative;
      background: radial-gradient(circle at center, #182036 0%, #0a0f1e 100%);
    }
    #avatar-container { width: 100%; height: 100%; }
    .status-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 8px 20px; border-radius: 20px; background: rgba(0,0,0,0.6);
      font-size: 13px; color: #aaa; white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Left: Controls -->
  <div class="chat-sidebar">
    <div>
      <p>Embeds <code>AvatarWidget</code> with full PantoMatrix lip-sync and emotion system.
         Voice flows through <code>/ws/s2s</code>: Vexyl STT → IndicTrans2 Translation → OmniVoice.</p>
    </div>

    <div>
      <label for="lang-select">Indic Language</label>
      <select id="lang-select">
        <option value="hi-IN">Hindi (hi-IN)</option>
        <option value="bn-IN">Bengali (bn-IN)</option>
        <option value="gu-IN">Gujarati (gu-IN)</option>
        <option value="kn-IN">Kannada (kn-IN)</option>
        <option value="ml-IN">Malayalam (ml-IN)</option>
        <option value="mr-IN">Marathi (mr-IN)</option>
        <option value="pa-IN">Punjabi (pa-IN)</option>
        <option value="ta-IN">Tamil (ta-IN)</option>
        <option value="te-IN">Telugu (te-IN)</option>
        <option value="ur-IN">Urdu (ur-IN)</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="btn-start">🎤 Start</button>
      <button id="btn-stop" class="secondary" disabled>⏹ Stop</button>
    </div>

    <div>
      <label for="emotion-select">Idle Emotion</label>
      <select id="emotion-select">
        <option value="neutral">😐 Neutral</option>
        <option value="happy" selected>😊 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="angry">😠 Angry</option>
        <option value="surprised">😲 Surprised</option>
      </select>
    </div>

    <div>
      <label>Pipeline Log</label>
      <div class="log-box" id="log-box">
        <div class="line">Waiting for session…</div>
      </div>
    </div>

    <p style="font-size:11px;color:#555;margin-top:auto;">
      Server: <code>ws://localhost:8765/ws/s2s</code>
    </p>
  </div>

  <!-- Right: 3D Avatar -->
  <div class="avatar-panel">
    <div id="avatar-container"></div>
    <div class="status-bar" id="status-bar">Avatar loading…</div>
  </div>
</div>

<script type="module">
  import { AvatarWidget } from './avatar-widget.js';

  const WS_BASE = window.location.origin.replace(/^http/, 'ws');
  const S2S_URL = `${WS_BASE}/ws/s2s`;

  // ── 1. Create avatar widget (keeps full PantoMatrix + emotion support) ──────
  const widget = new AvatarWidget({
    container: document.getElementById('avatar-container'),
    modelUrl:  'public/avatar_head.glb',
    onReady:   () => setStatus('● Avatar ready'),
  });

  // ── 2. Logging helpers ───────────────────────────────────────────────────────
  function log(text, cls = '') {
    const box  = document.getElementById('log-box');
    const line = document.createElement('div');
    line.className = `line ${cls}`;
    line.textContent = text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }
  function setStatus(text) { document.getElementById('status-bar').textContent = text; }

  // ── 3. S2S session state ─────────────────────────────────────────────────────
  let ws=null, audioCtx=null, nextPlayAt=0, micStream=null, workletNode=null;
  let isRunning=false, pendingMeta=null;

  // Audio buffering: wait for server-side PantoMatrix before playback
  const MATRIX_TIMEOUT_MS=500;
  const playbackQueue = [];
  let currentActiveSeq = null;

  const ensureACtx=()=>{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  };

  function flushSentence(sentence, reason) {
    if (sentence.flushed || sentence.chunks.length === 0) return;
    if (sentence.flushTimer) {
      clearTimeout(sentence.flushTimer);
      sentence.flushTimer = null;
    }

    const ctx = ensureACtx();
    console.log(`[Widget] Flush seq=${sentence.seq} with ${sentence.chunks.length} chunks (reason=${reason})`);

    const startTime = nextPlayAt < ctx.currentTime ? ctx.currentTime : nextPlayAt;
    let playCursor = startTime;

    for (const c of sentence.chunks) {
      const buf = ctx.createBuffer(1, c.f32.length, c.sampleRate);
      buf.getChannelData(0).set(c.f32);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(playCursor);
      playCursor += buf.duration;
    }

    sentence.startTime = startTime;
    sentence.duration = playCursor - startTime;
    sentence.flushed = true;
    nextPlayAt = playCursor;
  }

  // ── 5. Start/Stop session ─────────────────────────────────────────────────────────
  async function startSession() {
    if (isRunning) return;
    isRunning=true; pendingMeta=null; nextPlayAt=0; playbackQueue.length = 0; currentActiveSeq = null;
    ensureACtx();

    ws=new WebSocket(S2S_URL); ws.binaryType='arraybuffer';
    await new Promise((res,rej)=>{ws.onopen=()=>res();ws.onerror=()=>rej(new Error('WS failed'));});

    const lang=document.getElementById('lang-select').value;
    ws.send(JSON.stringify({type:'start',lang,session_id:`demo_${Date.now()}`}));
    ws.onmessage=handleMessage;
    ws.onclose=()=>{isRunning=false;teardownMic();setStatus('● Idle');updateBtns(false);};
    ws.onerror=()=>log('WebSocket error','err');

    try {
      micStream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:{ideal:16000},channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});
    } catch(err) { log(`Mic: ${err.message}`,'err'); stopSession(); return; }

    const mCtx=new AudioContext({sampleRate:16000});
    const code=`class P extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(!c)return true;const b=new Int16Array(c.length);for(let i=0;i<c.length;i++){const s=Math.max(-1,Math.min(1,c[i]));b[i]=s<0?s*0x8000:s*0x7FFF;}this.port.postMessage(b.buffer,[b.buffer]);return true;}}registerProcessor('pp',P);`;
    const u=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
    await mCtx.audioWorklet.addModule(u); URL.revokeObjectURL(u);
    const src=mCtx.createMediaStreamSource(micStream);
    workletNode=new AudioWorkletNode(mCtx,'pp');
    workletNode.port.onmessage=e=>{if(ws?.readyState===WebSocket.OPEN) ws.send(e.data);};
    src.connect(workletNode);

    setStatus('🎤 Listening…');
    log(`Session started — lang: ${lang}`,'transcript');
    updateBtns(true);
  }

  function stopSession() {
    if(ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'stop'}));
    teardownMic();
    isRunning=false;
    updateBtns(false);
    setStatus('⏳ Processing…');
    
    playbackQueue.forEach(s => {
      if (s.flushTimer) clearTimeout(s.flushTimer);
    });
    playbackQueue.length = 0;
    currentActiveSeq = null;
    widget.clearAnimation();
  }

  function teardownMic() {
    if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
    workletNode=null;
  }

  // Start the UI rendering monitor loop
  requestAnimationFrame(runRenderLoop);

  function runRenderLoop() {
    requestAnimationFrame(runRenderLoop);
    const nowAudioTime = audioCtx ? audioCtx.currentTime : 0;

    // Clean up finished sentences from the queue
    while (playbackQueue.length > 0 && 
           playbackQueue[0].flushed && 
           playbackQueue[0].startTime !== null && 
           nowAudioTime > playbackQueue[0].startTime + playbackQueue[0].duration + 1.0) {
      const old = playbackQueue.shift();
      if (old.flushTimer) clearTimeout(old.flushTimer);
    }

    // Find the sentence currently playing or scheduled next
    let activeSentence = null;
    for (const s of playbackQueue) {
      if (s.flushed && s.startTime !== null) {
        if (nowAudioTime <= s.startTime + s.duration + 0.2) {
          activeSentence = s;
          break;
        }
      }
    }

    if (activeSentence) {
      if (currentActiveSeq !== activeSentence.seq) {
        currentActiveSeq = activeSentence.seq;
        if (activeSentence.matrix) {
          widget.setAnimationMatrix(activeSentence.matrix);
        } else {
          widget.clearAnimation();
        }
        widget.syncAudio(audioCtx, activeSentence.startTime);
        setStatus('🔊 Speaking…');
      } else {
        // Late-arriving matrix handler
        if (activeSentence.matrix && !widget.currentAnimationMatrix) {
          widget.setAnimationMatrix(activeSentence.matrix);
        }
      }
    } else {
      if (currentActiveSeq !== null) {
        currentActiveSeq = null;
        widget.clearAnimation();
        setStatus('● Idle');
      }
    }
  }

  // ── 6. Handle server messages ────────────────────────────────────────────────
  function handleMessage(evt) {
    if (evt.data instanceof ArrayBuffer) {
      if (!pendingMeta) return;
      const {seq, sample_rate}=pendingMeta; pendingMeta=null;

      const f32=new Float32Array(evt.data);
      const sentence = playbackQueue.find(s => s.seq === seq);
      if (sentence) {
        sentence.chunks.push({f32, sampleRate:sample_rate});
        // Start flush timeout on first chunk
        if (!sentence.flushed && !sentence.flushTimer) {
          sentence.flushTimer = setTimeout(() => flushSentence(sentence, 'timeout'), MATRIX_TIMEOUT_MS);
        }
      }
      return;
    }

    let msg; try{msg=JSON.parse(evt.data);}catch{return;}

    switch(msg.type) {
      case 'transcript':
        log(`🎤 ${msg.text}`,'transcript');
        setStatus('💬 Transcribed — pipeline running…');
        break;

      case 'tts_start':
        log(`🔊 seq ${msg.seq}: ${msg.text}`,'tts');
        setStatus('🔊 Receiving audio…');
        playbackQueue.push({
          seq: msg.seq,
          chunks: [],
          matrix: null,
          startTime: null,
          duration: 0,
          flushed: false,
          flushTimer: null
        });
        break;

      case 'audio_chunk':
        pendingMeta={seq:msg.seq, sample_rate:msg.sample_rate};
        break;

      case 'blendshape_matrix':
        log(`🎭 seq ${msg.seq}: ${msg.matrix ? msg.matrix.length : 0} blendshape frames`,'tts');
        const sentence = playbackQueue.find(s => s.seq === msg.seq);
        if (sentence) {
          if (sentence.flushTimer) {
            clearTimeout(sentence.flushTimer);
            sentence.flushTimer = null;
          }
          sentence.matrix = msg.matrix;
          flushSentence(sentence, 'matrix');
        }
        break;

      case 'tts_end':
        const sent = playbackQueue.find(s => s.seq === msg.seq);
        if (sent) {
          if (sent.flushTimer) {
            clearTimeout(sent.flushTimer);
            sent.flushTimer = null;
          }
          flushSentence(sent, 'tts_end');
        }
        break;

      case 'pipeline_status': break; // heartbeat

      case 'error':
        log(`❌ ${msg.message}`,'err');
        setStatus('⚠️ Error');
        break;
    }
  }

  // ── 7. UI wiring ─────────────────────────────────────────────────────────────
  function updateBtns(running) {
    document.getElementById('btn-start').disabled=running;
    document.getElementById('btn-stop').disabled=!running;
  }

  document.getElementById('btn-start').addEventListener('click', ()=>startSession());
  document.getElementById('btn-stop').addEventListener('click',  ()=>stopSession());

  document.getElementById('emotion-select').addEventListener('change', e=>{
    widget.setEmotion(e.target.value);
  });
</script>

</body>
</html>
