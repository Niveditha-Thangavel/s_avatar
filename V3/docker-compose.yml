services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: avatar-server
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - WHISPER_MODEL_ID=Systran/faster-whisper-large-v3
      - OMNIVOICE_DEVICE=cpu
    volumes:
      # Persist model cache across rebuilds — avoids re-downloading ~7 GB
      - huggingface_cache:/root/.cache/huggingface
      - faster_whisper_cache:/root/.cache/faster_whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: avatar-frontend
    ports:
      - "3005:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  huggingface_cache:
  faster_whisper_cache:
