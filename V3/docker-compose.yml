x-gpu-device: &gpu-device
  driver: nvidia
  count: 1
  capabilities: [gpu]

services:

  vexyl-stt:
    build:
      context: https://github.com/vexyl-ai/vexyl-stt.git
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required. Set it in .env or export HF_TOKEN=hf_xxx}
    image: vexyl-stt:local
    container_name: vexyl-stt
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - VEXYL_STT_PORT=8080
    volumes:
      - vexyl_model_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    image: avatar-orchestrator:local
    container_name: avatar-orchestrator
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - VEXYL_STT_URL=ws://vexyl-stt:8080
      - INDIC_TRANS2_EN_INDIC=/root/.cache/ctranslate2/nllb-200-distilled-600M
      - INDIC_TRANS2_INDIC_EN=/root/.cache/ctranslate2/nllb-200-distilled-600M
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ctranslate2_cache:/root/.cache/ctranslate2
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      vexyl-stt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: avatar-frontend:local
    container_name: avatar-frontend
    ports:
      - "3005:80"
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ctranslate2_cache:
  huggingface_cache:
  vexyl_model_cache:
