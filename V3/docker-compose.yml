services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        BASE_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
        SKIP_TORCH_INSTALL: "true"
        WHISPER_MODEL_ID: Systran/faster-whisper-medium
    container_name: avatar-server
    ports:
      - "8765:8765"
    environment:
      - OMNIVOICE_DEVICE=cuda:0
      - WHISPER_MODEL_ID=Systran/faster-whisper-medium
      - TOKENIZERS_PARALLELISM=false
      - TORCH_ALLOW_TF32=1
      - CUDNN_BENCHMARK=1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - faster_whisper_cache:/root/.cache/faster_whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: avatar-frontend
    ports:
      - "3005:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  huggingface_cache:
  faster_whisper_cache:
