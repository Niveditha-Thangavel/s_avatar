x-gpu-device: &gpu-device
  driver: nvidia
  count: 1
  capabilities: [gpu]

services:

  vexyl-stt:
    build:
      context: https://github.com/vexyl-ai/vexyl-stt.git
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required. Set it in .env or export HF_TOKEN=hf_xxx}
    image: vexyl-stt:local
    container_name: vexyl-stt
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - VEXYL_STT_PORT=8080
    volumes:
      - vexyl_model_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    image: avatar-orchestrator:local
    container_name: avatar-orchestrator
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - VEXYL_STT_URL=ws://vexyl-stt:8080
      - NLLB_MODEL_PATH=/root/.cache/ctranslate2/nllb-200-distilled-600M
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    depends_on:
      vexyl-stt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: avatar-frontend:local
    container_name: avatar-frontend
    ports:
      - "3005:80"
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vexyl_model_cache:
