# docker-compose.yml — CPU / local dev default
#
# For GPU production deployment use:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        # CPU build by default — no NVIDIA required
        BASE_IMAGE: python:3.11-slim
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        SKIP_TORCH_INSTALL: "false"
        WHISPER_MODEL_ID: Systran/faster-whisper-medium
    image: avatar-server
    container_name: avatar-server
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - FASTER_WHISPER_CACHE=/root/.cache/faster_whisper
      - WHISPER_MODEL_ID=Systran/faster-whisper-medium
      - OMNIVOICE_DEVICE=cpu
    volumes:
      # Named volumes persist model weights across container recreates
      - huggingface_cache:/root/.cache/huggingface
      - faster_whisper_cache:/root/.cache/faster_whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # models take ~2 min to load from disk on first start

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: avatar-frontend
    container_name: avatar-frontend
    ports:
      - "3005:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  huggingface_cache:
  faster_whisper_cache:
