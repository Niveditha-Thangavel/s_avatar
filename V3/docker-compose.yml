# ─────────────────────────────────────────────────────────────────────────────
# S2S Voice Avatar — Full Stack
# docker compose up -d          (CPU / single GPU)
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d (multi-GPU)
#
# Services:
#   vexyl-stt   — Indic STT  (built from ghcr.io/vexyl-ai/vexyl-stt)
#   vllm-omni   — TTS        (vllm/vllm-omni serving k2-fsa/OmniVoice)
#   orchestrator— Python S2S orchestrator (built locally, using static mock responses for LLM)
#   frontend    — Nginx + Vite build
# ─────────────────────────────────────────────────────────────────────────────

x-gpu-device: &gpu-device
  driver: nvidia
  count: 1
  capabilities: [gpu]

services:

  # ── 1. Vexyl STT ─────────────────────────────────────────────────────────
  # Built from source: https://github.com/vexyl-ai/vexyl-stt
  # Exposes a WebSocket server on port 8080.
  # Protocol: ws://vexyl-stt:8080
  #   Client sends: { type:"start", lang:"hi-IN" } then binary Int16 PCM @ 16kHz
  #   Server sends: { type:"final", text:"...", lang:"hi-IN" }
  vexyl-stt:
    build:
      context: https://github.com/vexyl-ai/vexyl-stt.git
      dockerfile: Dockerfile
      args:
        # HF_TOKEN is required to download ai4bharat/indic-conformer-600m-multilingual.
        # Set it in .env file or export before building:
        #   export HF_TOKEN=hf_xxxxxxxxxxxxxxxxxxxxxxx
        HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required. Set it in .env or export HF_TOKEN=hf_xxx}
    image: vexyl-stt:local
    container_name: vexyl-stt
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - VEXYL_STT_PORT=8080
    volumes:
      - vexyl_model_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── 4. S2S Orchestrator ───────────────────────────────────────────────────
  # Built from local Dockerfile.server.
  # Wires: Vexyl STT → IndicTrans2 → LLM → IndicTrans2 → OmniVoice TTS
  # IndicTrans2 CT2 and OmniVoice models are downloaded at build time into the volume.
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    image: avatar-orchestrator:local
    container_name: avatar-orchestrator
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - VEXYL_STT_URL=ws://vexyl-stt:8080
      - INDIC_TRANS2_EN_INDIC=/root/.cache/ctranslate2/en-indic-1B
      - INDIC_TRANS2_INDIC_EN=/root/.cache/ctranslate2/indic-en-1B
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ctranslate2_cache:/root/.cache/ctranslate2
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      vexyl-stt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── 5. Frontend ───────────────────────────────────────────────────────────
  # Vite build served by Nginx. Proxies /ws → orchestrator:8765
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: avatar-frontend:local
    container_name: avatar-frontend
    ports:
      - "3005:80"
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  ctranslate2_cache:
    # IndicTrans2 CT2 models (~2.4 GB) — pre-downloaded at build time
  huggingface_cache:
    # HuggingFace model weights for LLM + TTS (~10-20 GB depending on models)
  vexyl_model_cache:
    # Vexyl STT Whisper/ASR model weights
