# docker-compose.gpu.yml — GPU override for multi-GPU hosts
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Gives all available GPUs to all GPU-capable services (STT, translation engine, and TTS).

services:
  vexyl-stt:
    build:
      context: ./vexyl_stt_src
      dockerfile: Dockerfile.gpu
      args:
        HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required. Set it in .env or export HF_TOKEN=hf_xxx}
    environment:
      - VEXYL_STT_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  orchestrator:
    environment:
      - TRANSLATION_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

