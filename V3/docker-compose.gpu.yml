# docker-compose.gpu.yml — GPU override for multi-GPU hosts
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Gives all available GPUs to all GPU-capable services (STT, translation engine, and TTS).

services:
  vexyl-stt:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  orchestrator:
    environment:
      - TRANSLATION_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

