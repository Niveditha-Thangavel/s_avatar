# docker-compose.gpu.yml — GPU production override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requirements on host:
#   - nvidia-container-toolkit installed and configured
#   - NVIDIA driver 525+ with CUDA 12.4

services:
  server:
    build:
      args:
        # PyTorch CUDA 12.4 conda base — torch pre-installed, skip pip reinstall
        BASE_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
        SKIP_TORCH_INSTALL: "true"
        WHISPER_MODEL_ID: Systran/faster-whisper-medium
    image: avatar-server-gpu
    environment:
      # GPU device selection
      - OMNIVOICE_DEVICE=cuda:0
      - WHISPER_MODEL_ID=Systran/faster-whisper-medium
      # Performance tuning
      - TORCH_ALLOW_TF32=1
      - CUDNN_BENCHMARK=1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
