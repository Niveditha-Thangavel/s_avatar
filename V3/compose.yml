services:

  vexyl-stt:
    build:
      context: ./server/vexyl_stt
      dockerfile: Dockerfile
    image: vexyl-stt:local
    container_name: vexyl-stt
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - VEXYL_STT_PORT=8080
      - VEXYL_STT_DEVICE=cuda
      - VEXYL_STT_SILENCE_DURATION=1.2
      - VEXYL_STT_SILENCE_THRESHOLD=0.015
      - VEXYL_STT_MIN_SPEECH_DURATION=0.3
      # HF_TOKEN only needed on first run for gated model download.
      # Once cached in the volume, you can remove it.
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./model_cache/vexyl:/root/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 600s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: avatar-server:local
    container_name: avatar-server
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - VEXYL_STT_URL=ws://vexyl-stt:8080
      - TRANSLATION_DEVICE=cuda
      - INDIC_TRANS2_EN_INDIC=/root/.cache/ctranslate2/ct2-rotary-indictrans2-en-indic-dist-200M/en-indic-200m-ct2/ctranslate2_model
      - INDIC_TRANS2_INDIC_EN=/root/.cache/ctranslate2/ct2-rotary-indictrans2-indic-en-dist-200M/indic-en-200m-ct2/ctranslate2_model
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./model_cache/server:/root/.cache
    depends_on:
      vexyl-stt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


